<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="講義資料から小テストを作成し、学生の回答を集計する講義支援アプリです。">
  <title>Lecture Feedback</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Lecture Feedback ホーム">
      <span class="brand-mark" aria-hidden="true">LF</span>
      <span>Lecture Feedback</span>
    </a>
  </header>

  <main class="landing-main">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">LECTURE SUPPORT TOOL</p>
      <h1 id="page-title">講義の理解を、すぐに確かめる。</h1>
      <p class="hero-copy">
        講義テキストやPDFから小テストを作成し、学生の回答と理解度を確認できます。
        利用する画面を選んでください。
      </p>
    </section>

    <section class="role-grid" aria-label="利用画面を選択">
      <a class="role-card role-card-teacher" href="teacher.html">
        <span class="role-icon" aria-hidden="true">作</span>
        <span class="role-card-body">
          <span class="role-label">教員用</span>
          <strong>小テストを作成・分析する</strong>
          <span>教材の入力、問題の確認、学生用URLの共有、回答結果の分析を行います。</span>
        </span>
        <span class="role-arrow" aria-hidden="true">→</span>
      </a>

      <a class="role-card role-card-student" href="student.html">
        <span class="role-icon" aria-hidden="true">答</span>
        <span class="role-card-body">
          <span class="role-label">学生用</span>
          <strong>小テストに回答する</strong>
          <span>教員から共有されたURLまたはquiz_idを使って、小テストに回答します。</span>
        </span>
        <span class="role-arrow" aria-hidden="true">→</span>
      </a>
    </section>

    <p class="landing-note">このデモではログインは必要ありません。</p>
  </main>
</body>
</html>
